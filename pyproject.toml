[project]
name = "dqn-lunar-lander"
version = "1.0.0"
description = "Deep Q-Network agent for Gymnasium LunarLander-v3"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers deliberately, and the original notebook is
# kept verbatim as a record of what was submitted.
"tests/*" = ["SLF001"]
"notebooks/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
